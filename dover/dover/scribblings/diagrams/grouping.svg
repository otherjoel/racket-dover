<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .start { fill: #f7f7f7; stroke: #555; stroke-width: 1.2; }
    .decision { fill: #fff; stroke: #555; stroke-width: 1.2; }
    .outcome { fill: #eaf3f9; stroke: #07a; stroke-width: 1.2; }
    .edge { stroke: #555; stroke-width: 1.5; fill: none; }
    .text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #222; }
    .label { font: italic 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #555; }
    .tie { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #555; }
  </style>

  <!-- Start -->
  <rect class="start" x="210" y="13" width="180" height="34" rx="17"/>
  <text class="text" x="300" y="35" text-anchor="middle">A scored binding</text>
  <line class="edge" x1="300" y1="47" x2="300" y2="63" marker-end="url(#arrow)"/>

  <!-- Is it documented? -->
  <polygon class="decision" points="300,65 420,105 300,145 180,105"/>
  <text class="text" x="300" y="101" text-anchor="middle">Is it</text>
  <text class="text" x="300" y="117" text-anchor="middle">documented?</text>

  <path class="edge" d="M180,105 H140 V168" marker-end="url(#arrow)"/>
  <text class="label" x="172" y="98" text-anchor="end">yes</text>
  <path class="edge" d="M420,105 H460 V168" marker-end="url(#arrow)"/>
  <text class="label" x="428" y="98">no</text>

  <!-- Documented: do its docs name a module that exports it? -->
  <polygon class="decision" points="140,170 255,225 140,280 25,225"/>
  <text class="text" x="140" y="213" text-anchor="middle">Do its docs name</text>
  <text class="text" x="140" y="229" text-anchor="middle">a module that</text>
  <text class="text" x="140" y="245" text-anchor="middle">exports it?</text>

  <!-- Missing: are its siblings reported under a module that exports it? -->
  <polygon class="decision" points="460,170 575,225 460,280 345,225"/>
  <text class="text" x="460" y="213" text-anchor="middle">Are its siblings*</text>
  <text class="text" x="460" y="229" text-anchor="middle">under a module</text>
  <text class="text" x="460" y="245" text-anchor="middle">that exports it?</text>

  <!-- Yes branches -->
  <line class="edge" x1="140" y1="280" x2="140" y2="306" marker-end="url(#arrow)"/>
  <text class="label" x="148" y="298">yes</text>
  <line class="edge" x1="460" y1="280" x2="460" y2="306" marker-end="url(#arrow)"/>
  <text class="label" x="468" y="298">yes</text>

  <rect class="outcome" x="20" y="308" width="240" height="56" rx="6"/>
  <text class="text" x="140" y="332" text-anchor="middle">Report under the first module</text>
  <text class="text" x="140" y="350" text-anchor="middle">its docs name that exports it</text>

  <rect class="outcome" x="340" y="308" width="240" height="70" rx="6"/>
  <text class="text" x="460" y="332" text-anchor="middle">Report under the module that</text>
  <text class="text" x="460" y="350" text-anchor="middle">most of those siblings are under</text>
  <text class="tie" x="460" y="368" text-anchor="middle">(ties: the first in sort order)</text>

  <!-- No branches meet and go to the nearest checked module -->
  <path class="edge" d="M255,225 H300"/>
  <text class="label" x="264" y="218">no</text>
  <path class="edge" d="M345,225 H300"/>
  <text class="label" x="336" y="218" text-anchor="end">no</text>
  <line class="edge" x1="300" y1="225" x2="300" y2="406" marker-end="url(#arrow)"/>

  <rect class="outcome" x="165" y="408" width="270" height="70" rx="6"/>
  <text class="text" x="300" y="432" text-anchor="middle">Report under the checked module</text>
  <text class="text" x="300" y="450" text-anchor="middle">nearest its definition</text>
  <text class="tie" x="300" y="468" text-anchor="middle">(ties: the first in sort order)</text>

  <!-- Footnote -->
  <text class="tie" x="300" y="505" text-anchor="middle">* Siblings: the documented bindings defined in the same module.</text>
</svg>
